<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    body { margin: 0; padding: 0; background: transparent; overflow: hidden; }
    
    .floating-cart-btn {
      position: fixed;
      bottom: 10px;
      right: 10px;
      width: 56px;
      height: 56px;
      background-color: #D4AF37;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.6);
      cursor: pointer;
      text-decoration: none;
    }

    .cart-svg { width: 26px; height: 26px; fill: #000000; }

    .cart-badge {
      position: absolute;
      top: 0px;
      right: 0px;
      background-color: #FF4D4D;
      color: #FFFFFF;
      font-family: sans-serif;
      font-size: 11px;
      font-weight: bold;
      height: 20px;
      min-width: 20px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 4px;
      border: 2px solid #0D0D0D;
    }
  </style>
  <script src="cart-bridge.js"></script>
</head>
<body>

  <!-- Open full Google Sites cart page outside the iframe -->
  <a href="https://your-google-sites-cart-url-here" target="_top" class="floating-cart-btn">
    <svg class="cart-svg" viewBox="0 0 24 24">
      <path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.08-.14.12-.31.12-.48 0-.55-.45-1-1-1H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"/>
    </svg>
    <span class="cart-badge" id="cartBadgeCount">0</span>
  </a>

  <script>
    function syncBadge() {
      const count = getCartCount();
      const badge = document.getElementById('cartBadgeCount');
      if (badge) {
        badge.innerText = count;
        badge.style.display = count > 0 ? 'flex' : 'none';
      }
    }

    syncBadge();
    window.addEventListener('storage', syncBadge);
    window.addEventListener('cartUpdated', syncBadge);
    setInterval(syncBadge, 1000); // Ensures live iframe synchronization
  </script>
</body>
</html>
