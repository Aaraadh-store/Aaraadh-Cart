<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="cart-bridge.js"></script>
  <style>
    body { background: #0D0D0D; color: #FFF; font-family: sans-serif; padding: 15px; margin: 0; }
    .product-card { background: #181818; border: 1px solid #262626; border-radius: 8px; padding: 16px; max-width: 350px; }
    .btn-add { background: #D4AF37; color: #000; border: none; padding: 10px 16px; font-weight: bold; border-radius: 4px; cursor: pointer; width: 100%; margin-top: 12px; }
  </style>
</head>
<body>

  <div class="product-card" id="productBox">
    <h3 id="pTitle">Loading product...</h3>
    <p id="pSku" style="color: #A0A0A0; font-size: 0.8rem;"></p>
    <button class="btn-add" onclick="handleAddToCart()">Add to Bag</button>
  </div>

  <script>
    // Extract SKU from URL query parameter
    const urlParams = new URLSearchParams(window.location.search);
    const sku = urlParams.get('sku');

    document.getElementById('pSku').innerText = "SKU: " + (sku || "N/A");
    document.getElementById('pTitle').innerText = sku ? "AARAADH " + sku : "Product";

    function handleAddToCart() {
      addToCart({
        title: "AARAADH " + (sku || "T-Shirt"),
        sku: sku,
        price: 799, // Adjust dynamically or fetch from CSV/Sheet
        color: "Black",
        size: "L",
        qty: 1
      });
      alert("Added to bag!");
    }
  </script>
</body>
</html>
